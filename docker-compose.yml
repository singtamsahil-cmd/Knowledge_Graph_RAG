services:
  neo4j:
    image: neo4j:5-community
    container_name: kg-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-change_this_password}
    volumes:
      - neo4j_data:/data
      - ${BACKUP_DIR:-./backups}:/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-change_this_password} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    container_name: kg-app
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-change_this_password}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - SPACY_MODEL=en_core_web_lg
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_ENABLED=${QDRANT_ENABLED:-true}
      - EMBED_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./data/input:/app/data/input:ro
      - ./outputs:/app/outputs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["python", "main.py"]
    command: ["--help"]

  frontend:
    build: .
    container_name: kg-frontend
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-change_this_password}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - SPACY_MODEL=en_core_web_lg
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Ollama runs on the HOST (not Docker): reachable via host.docker.internal
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama-local}
      - CLOUD_MODEL=${CLOUD_MODEL:-gemma4:31b}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_ENABLED=${QDRANT_ENABLED:-true}
      - EMBED_BASE_URL=http://host.docker.internal:11434
    ports:
      - "8501:8501"
    volumes:
      - ./data/input:/app/data/input
      - ./outputs:/app/outputs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    entrypoint: ["streamlit", "run", "frontend/app.py",
                 "--server.address=0.0.0.0", "--server.port=8501"]
    command: []

  api:
    build: .
    container_name: kg-api
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-change_this_password}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - SPACY_MODEL=en_core_web_lg
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Ollama runs on the HOST (not Docker): reachable via host.docker.internal
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama-local}
      - CLOUD_MODEL=${CLOUD_MODEL:-gemma4:31b}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_ENABLED=${QDRANT_ENABLED:-true}
      - EMBED_BASE_URL=http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - ./data/input:/app/data/input:ro
      - ./outputs:/app/outputs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    entrypoint: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    command: []

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: kg-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:6333/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

volumes:
  neo4j_data:
  qdrant_data:
